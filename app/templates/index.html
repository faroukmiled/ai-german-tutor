<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title> Deutsch-Tutor</title>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    #chat p { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>{{ greeting }}</h1>

  <div id="chat"></div>

  <form hx-post="/chat" hx-target="#chat" hx-swap="beforeend"
      hx-on::after-request="this.reset()"  hx-indicator="#thinking" hx-disabled-elt="find button">
      <p id="thinking" class="htmx-indicator">Tutor denkt nach…</p>
    <input name="message" placeholder="Schreib auf Deutsch…" required>
    <button>Senden</button>
  </form>
</body>
</html>
